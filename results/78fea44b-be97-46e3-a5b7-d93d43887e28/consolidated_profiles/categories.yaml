table_name: categories
table_semantics:
  description: Lookup table defining product categories and their parent department.
  business_entity: Category
  row_grain: One row per distinct product category.
columns:
  category_id:
    datatype: STRING
    description: Unique identifier for the category.
    semantic_role: identifier
    semantic_type: category_id
    entity: Category
  category_name:
    datatype: STRING
    description: Human‑readable name of the category.
    semantic_role: categorical
    semantic_type: category_name
    entity: Category
  department:
    datatype: STRING
    description: Name of the department to which the category belongs.
    semantic_role: categorical
    semantic_type: department_name
    entity: Department
  is_active:
    datatype: BOOLEAN
    description: Flag indicating whether the category is currently active.
    semantic_role: boolean_flag
    semantic_type: is_active
    entity: Category
