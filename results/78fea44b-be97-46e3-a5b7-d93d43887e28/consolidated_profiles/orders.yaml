table_name: orders
table_semantics:
  description: Transactional record of each customer order with dates, channels, status, monetary amounts and shipping location.
  business_entity: order
  row_grain: one row per order
columns:
  order_id:
    datatype: STRING
    description: Unique identifier for the order.
    semantic_role: identifier
    semantic_type: order_id
    entity: order
  customer_id:
    datatype: STRING
    description: Identifier of the customer who placed the order.
    semantic_role: identifier
    semantic_type: customer_id
    entity: customer
  order_date:
    datatype: DATE
    description: Date when the order was created.
    semantic_role: temporal
    semantic_type: order_date
    entity: order
  sales_channel:
    datatype: STRING
    description: Channel through which the order was placed (e.g., APP, WEB, MOBILE_WEB).
    semantic_role: categorical
    semantic_type: sales_channel
    entity: order
  order_status:
    datatype: STRING
    description: Current status of the order (e.g., DELIVERED, CANCELLED).
    semantic_role: categorical
    semantic_type: order_status
    entity: order
  items_subtotal:
    datatype: DECIMAL(12,2)
    description: Total price of items before fees and discounts.
    semantic_role: measure
    semantic_type: items_subtotal
    entity: order
  shipping_fee:
    datatype: DECIMAL(12,2)
    description: Fee charged for shipping the order.
    semantic_role: measure
    semantic_type: shipping_fee
    entity: order
  order_discount:
    datatype: DECIMAL(12,2)
    description: Discount amount applied to the order.
    semantic_role: measure
    semantic_type: order_discount
    entity: order
  total_amount:
    datatype: DECIMAL(12,2)
    description: Final amount charged to the customer (subtotal + fees – discounts).
    semantic_role: measure
    semantic_type: total_amount
    entity: order
  currency:
    datatype: STRING
    description: Currency code of monetary values (e.g., INR).
    semantic_role: categorical
    semantic_type: currency_code
    entity: order
  shipping_city:
    datatype: STRING
    description: City to which the order is shipped.
    semantic_role: categorical
    semantic_type: shipping_city
    entity: order
  shipping_state:
    datatype: STRING
    description: State to which the order is shipped.
    semantic_role: categorical
    semantic_type: shipping_state
    entity: order
